<!DOCTYPE html>
<html>
  <head>
    <title>Web Technology</title>
    <style type="text/css">
      p{
        background-color:  purple;
      }
      .bold {
        font-weight: bold;
      }

      ul > li {
        background-color:  red;
      }
      p:hover {
        background-color:  green;
      }
    </style>
  </head>
  <body>
    <ul>
      <li> Item one </li>
      <li> Item two </li>
        <ol>
          <li> Nested item one </li>
          <li> Nested item two </li>
        </ol>
      <li> Item three </li>
    </ul>

    <div>
      <p> Line One </p>
      <p> Line Two </p>
      <div> Box </div>
      <p> Line Three </p>
      <p> Line Four </p>
    </div>
  </body>
</html>
