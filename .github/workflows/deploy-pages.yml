name: Deploy generated site to GitHub Pages

on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-pages.yml]
  workflow_dispatch:
  repository_dispatch:
    types: [publish-generated-site]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the generated site
        uses: actions/checkout@v6
        with:
          ref: gh-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
